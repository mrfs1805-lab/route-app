  if(sug){var n=disp(sug.name).main,dr=dirOf(sug.b),m=Math.round(sug.d);
   big.className='big';big.textContent=n;tt.textContent='Nearest: '+n+' locate · '+m+' m '+dr;
   ss.textContent='You are not inside any locate';}}
 ww.textContent=(acc>25)?('GPS accuracy low (±'+Math.round(acc)+' m) – result may be wrong'):'';}
function draw(){
 var ll=[pos.lat,pos.lng];
 if(!mk){mk=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="lvd"></div>',iconSize:[0,0]}),interactive:false,zIndexOffset:2000}).addTo(map);
  ring=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="lvr"></div>',iconSize:[0,0]}),interactive:false,zIndexOffset:1000}).addTo(map);}
 else{mk.setLatLng(ll);ring.setLatLng(ll);}
 var e=ring.getElement();if(e&&e.firstChild){var mpp=156543.03392*Math.cos(pos.lat*Math.PI/180)/Math.pow(2,map.getZoom());
  var rp=Math.max(6,Math.min(3000,pos.acc/mpp)),s=e.firstChild.style;s.width=s.height=(2*rp)+'px';s.marginLeft=s.marginTop=(-rp)+'px';}}
map.on('zoom zoomend',function(){if(pos)draw();});
function pop(h,m){var o=$('pop');if(o)o.remove();o=document.createElement('div');o.id='pop';
 o.innerHTML='<div class="bx"><b class="h"></b><div class="m"></div><div class="bt"><button class="c">Close</button><button class="p r">Try again</button></div></div>';
 o.querySelector('.h').textContent=h;o.querySelector('.m').innerHTML=m;
 o.querySelector('.c').onclick=function(){o.remove();};
 o.querySelector('.r').onclick=function(){o.remove();start();};document.body.appendChild(o);}
function fail(code){stop();
 if(code===1)pop('Location is blocked','Allow location for this page.<br>Chrome: tap the lock / (i) icon next to the address &gt; Permissions &gt; Location &gt; Allow.');
 else pop('Please turn on Location','Turn on <b>Location (GPS)</b> in your phone settings / quick panel, then tap <b>Try again</b>.');}
function stop(){clearTimeout(tm);if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;pos=null;firstFix=true;
 if(mk){map.removeLayer(mk);map.removeLayer(ring);mk=ring=null;}
 $('big').className='big none';$('big').textContent='Location is off';$('tt').textContent='Turn on location to see your locate';$('ss').textContent='';$('ww').textContent='';}
function start(){
 if(watch!=null)return;
 if(!navigator.geolocation){pop('Not supported','This browser does not support location.');return;}
 $('big').className='big none';$('big').textContent='…';$('tt').textContent='Finding your location…';$('ss').textContent='';
 tm=setTimeout(function(){if(!pos)fail(2);},15000);
 watch=navigator.geolocation.watchPosition(function(p){
  clearTimeout(tm);pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||10};
  draw();var rs=classify(pos.lng,pos.lat);show(rs,pos.acc,rs?null:suggest(pos.lng,pos.lat));
  if(firstFix){firstFix=false;map.setView([pos.lat,pos.lng],Math.max(map.getZoom(),18));}
 },function(err){if(pos&&err.code!==1)return;fail(err.code);},{enableHighAccuracy:true,maximumAge:1000,timeout:20000});}
$('loc').onclick=function(){if(pos)map.setView([pos.lat,pos.lng],Math.max(map.getZoom(),18));else start();};
start();
}
</script></body></html>
