  for(k=0;k<LINES.length;k++){if(k===i)continue;
   var q=nearest([r.fx,r.fy],LINES[k].p);
   if(q&&q.d<=PAIR&&Math.abs(q.ux*r.ux+q.uy*r.uy)>=PAR&&(!pq||q.d<pq.d))pq=q;}
  if(pq){var ps=side(r,pq.fx,pq.fy);if(ps!==0&&sp===ps)blocked=true;}}
 if(!blocked&&(!best||r.d<best.d))best={kind:'line',name:LINES[i].n,d:r.d,pair:!!pq};
}
if(best)return best;
var hit=null;
for(i=0;i<AREAS.length;i++){var A=AREAS[i];
 if(P[0]<A.b[0]||P[0]>A.b[2]||P[1]<A.b[1]||P[1]>A.b[3])continue;
 if(inPoly(P[0],P[1],A.p)&&(!hit||A.a<hit.a))hit=A;}
return hit?{kind:'area',name:hit.n,d:0}:null;}
/* nearest locate (area boundary or road line) for a point outside every locate */
function suggest(lon,lat){var P=pj([lon,lat]),best=null,i,r;
for(i=0;i<AREAS.length;i++){var ring=AREAS[i].p.concat([AREAS[i].p[0]]);r=nearest(P,ring);
 if(r&&(!best||r.d<best.d))best={kind:'area',name:AREAS[i].n,d:r.d,fx:r.fx,fy:r.fy};}
for(i=0;i<LINES.length;i++){r=nearest(P,LINES[i].p);
 if(r&&(!best||r.d<best.d))best={kind:'line',name:LINES[i].n,d:r.d,fx:r.fx,fy:r.fy};}
if(best){var b=(Math.atan2(best.fx-P[0],best.fy-P[1])*180/Math.PI+360)%360;best.b=b;}
return best;}
var DIR=['N','NE','E','SE','S','SW','W','NW'];
function dirOf(b){return DIR[Math.round(b/45)%8];}
/*CLS_END*/
return{classify:classify,suggest:suggest,dirOf:dirOf,LINES:LINES,AREAS:AREAS,KX:KX,KY:KY,nearest:nearest,side:side};
}
/* ===== finder screen ===== */
function runFinder(cfg,eng){
var map=L.map('map',{zoomControl:true,attributionControl:false,zoomAnimation:false,fadeAnimation:false}).setView(cfg.view,cfg.zoom);
/* Hybrid (satellite + labels); fallback = Esri imagery + Esri labels */
var g=L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:21});
var esri=[L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}),
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})];
var gOk=0,gErr=0,fell=false;
g.on('tileload',function(){gOk++;});
g.on('tileerror',function(){gErr++;if(!fell&&gErr>=4&&gOk===0){fell=true;map.removeLayer(g);esri.forEach(function(l){l.addTo(map);});}});
g.addTo(map);
var mk=null,ring=null,pos=null,watch=null,tm=null,firstFix=true;
function disp(n){var m=n.match(/^\s*(\d+)/);return{main:m?m[1]:n,full:n};}
function show(res,acc,sug){
 var big=$('big'),tt=$('tt'),ss=$('ss'),ww=$('ww');
 if(res){var d=disp(res.name);big.className='big';big.textContent=d.main;
  tt.textContent='This is '+d.main+' locate';
  ss.textContent=(res.kind==='line'?'Main road line ('+res.d.toFixed(1)+' m away)':'Inside area')+(d.full!==d.main?' · '+d.full:'');}
 else{big.className='big none';big.textContent='No locate here';tt.textContent='You are outside all mapped locates';ss.textContent='';
  if(sug){var n=disp(sug.name).main,dr=eng.dirOf(sug.b),m=Math.round(sug.d);
   big.className='big';big.textContent=n;tt.textContent='Nearest: '+n+' locate · '+m+' m '+dr;
   ss.textContent='You are not inside any locate';}}
 ww.textContent=(acc>25)?('GPS accuracy low (±'+Math.round(acc)+' m) – result may be wrong'):'';}
function draw(){
 var ll=[pos.lat,pos.lng];
 if(!mk){mk=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="lvd"></div>',iconSize:[0,0]}),interactive:false,zIndexOffset:2000}).addTo(map);
  ring=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="lvr"></div>',iconSize:[0,0]}),interactive:false,zIndexOffset:1000}).addTo(map);}
 else{mk.setLatLng(ll);ring.setLatLng(ll);}
 var e=ring.getElement();if(e&&e.firstChild){var mpp=156543.03392*Math.cos(pos.lat*Math.PI/180)/Math.pow(2,map.getZoom());
  var rp=Math.max(6,Math.min(3000,pos.acc/mpp)),s=e.firstChild.style;s.width=s.height=(2*rp)+'px';s.marginLeft=s.marginTop=(-rp)+'px';}}
map.on('zoom zoomend',function(){if(pos)draw();});
function pop(h,m){var o=$('pop');if(o)o.remove();o=document.createElement('div');o.id='pop';
 o.innerHTML='<div class="bx"><b class="h"></b><div class="m"></div><div class="bt"><button class="c">Close</button><button class="p r">Try again</button></div></div>';
 o.querySelector('.h').textContent=h;o.querySelector('.m').innerHTML=m;
 o.querySelector('.c').onclick=function(){o.remove();};
 o.querySelector('.r').onclick=function(){o.remove();start();};document.body.appendChild(o);}
function fail(code){stop();
 if(code===1)pop('Location is blocked','Allow location for this page.<br>Chrome: tap the lock / (i) icon next to the address &gt; Permissions &gt; Location &gt; Allow.');
 else pop('Please turn on Location','Turn on <b>Location (GPS)</b> in your phone settings / quick panel, then tap <b>Try again</b>.');}
function stop(){clearTimeout(tm);if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;pos=null;firstFix=true;
 if(mk){map.removeLayer(mk);map.removeLayer(ring);mk=ring=null;}
 $('big').className='big none';$('big').textContent='Location is off';$('tt').textContent='Turn on location to see your locate';$('ss').textContent='';$('ww').textContent='';}
function start(){
 if(watch!=null)return;
 if(!navigator.geolocation){pop('Not supported','This browser does not support location.');return;}
 $('big').className='big none';$('big').textContent='…';$('tt').textContent='Finding your location…';$('ss').textContent='';
 tm=setTimeout(function(){if(!pos)fail(2);},15000);
 watch=navigator.geolocation.watchPosition(function(p){
  clearTimeout(tm);pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||10};
  draw();var rs=eng.classify(pos.lng,pos.lat);show(rs,pos.acc,rs?null:eng.suggest(pos.lng,pos.lat));
  if(firstFix){firstFix=false;map.setView([pos.lat,pos.lng],Math.max(map.getZoom(),18));}
 },function(err){if(pos&&err.code!==1)return;fail(err.code);},{enableHighAccuracy:true,maximumAge:1000,timeout:20000});}
$('loc').onclick=function(){if(pos)map.setView([pos.lat,pos.lng],Math.max(map.getZoom(),18));else start();};

start();
return{destroy:function(){clearTimeout(tm);if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;var o=$('pop');if(o)o.remove();map.remove();}};
}
/* ===== home screen ===== */
(function(){
var opts=[].slice.call(document.querySelectorAll('.opt')),startBtn=$('start'),hint=$('hint'),sel=null,KEY='docketFinderChoice',engines={},cur=null,pushed=false;
function pick(el){sel=el;opts.forEach(function(o){var on=(o===el);o.classList.toggle('sel',on);o.setAttribute('aria-checked',on?'true':'false');});
 startBtn.disabled=!el;hint.textContent=el?'':'Please select an option';
 try{if(el)localStorage.setItem(KEY,el.getAttribute('data-key'));}catch(e){}}
opts.forEach(function(o){o.addEventListener('click',function(){pick(o);});});
function open(key){
 if(typeof L==='undefined'){hint.textContent='Map could not load. Check your internet connection.';return;}
 var cfg=CONFIG[key];if(!cfg)return;
 if(!engines[key])engines[key]=makeEngine(cfg);
 $('home').style.display='none';$('finder').style.display='block';
 cur=runFinder(cfg,engines[key]);
 try{history.pushState({finder:key},'');pushed=true;}catch(e){pushed=false;}}
function close(){if(!cur)return;cur.destroy();cur=null;$('finder').style.display='none';$('home').style.display='block';}
startBtn.addEventListener('click',function(){if(sel)open(sel.getAttribute('data-key'));});
$('back').addEventListener('click',function(){if(pushed){pushed=false;history.back();}else close();});
window.addEventListener('popstate',function(){pushed=false;close();});
try{var last=localStorage.getItem(KEY);opts.forEach(function(o){if(o.getAttribute('data-key')===last)pick(o);});}catch(e){}
})();
</script></body></html>
